spring.application.name=api-calendario
server.address=${HOST:127.0.0.1}
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/calendario}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

festivos.url=${FESTIVOS_URL:http://127.0.0.1:8080}
festivos.timeout=${FESTIVOS_TIMEOUT:5s}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
